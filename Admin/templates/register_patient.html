<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #134e4a 0%, #0f766e 50%, #0d9488 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .reg-card { background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); width: 100%; max-width: 600px; padding: 40px; }
        .input-group-text { background: #f0fdfa; border-right: none; }
        .form-control { border-left: none; }
        .btn-teal { background: #0d9488; color: white; border: none; }
        .btn-teal:hover { background: #0f766e; color: white; }
    </style>
</head>
<body>
    <div class="reg-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-4 mb-2" style="background: rgba(13,148,136,0.1);">
                <i class="bi bi-person-plus-fill display-5" style="color: #0d9488;"></i>
            </div>
            <h4 class="fw-bold mb-1">Create Patient Account</h4>
            <p class="text-muted small">Join MediConnect to book appointments & manage your health</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                    <i class="bi bi-info-circle me-1"></i>{{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register_patient') }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label small fw-bold">Full Name *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Email Address *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="patient@email.com" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Phone Number *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="text" name="phone" class="form-control" placeholder="+880 1XXX-XXXXXX" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Confirm Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Date of Birth</label>
                    <input type="date" name="dob" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Blood Group</label>
                    <select name="blood_group" class="form-select">
                        <option value="">Select</option>
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Emergency Contact (Optional)</label>
                    <input type="text" name="emergency_contact" class="form-control" placeholder="Emergency contact name & phone">
                </div>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-3 fw-bold rounded-3 mt-4">
                <i class="bi bi-check-circle me-2"></i>Create My Account
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Already have an account?</small>
            <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #0d9488;">Sign In</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
