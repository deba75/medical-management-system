<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Secret Gateway - MediConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-login-card {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border: 1px solid #334155;
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
        }
        .form-control:focus {
            background: #0f172a;
            color: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .input-group-text {
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
        }
        .btn-admin-submit {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-admin-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="admin-login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-4 bg-indigo bg-opacity-20 mb-3 border border-indigo border-opacity-25" style="background: rgba(99, 102, 241, 0.15);">
                <i class="bi bi-shield-lock-fill text-indigo display-5" style="color: #818cf8;"></i>
            </div>
            <h4 class="fw-bold mb-1">Super Admin Portal</h4>
            <p class="text-secondary small">Restricted Management Access Gateway</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                    <i class="bi bi-info-circle me-1"></i>{{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="mb-3">
                <label class="form-label small fw-bold text-slate-300">Admin Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="admin@mediconnect.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-slate-300">Admin Secret Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-admin-submit w-100 py-3 fw-bold rounded-3 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Authenticate Admin Access
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-secondary d-block"><i class="bi bi-lock me-1"></i> Unauthorized access attempts are logged.</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
