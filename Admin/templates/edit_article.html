{% extends "base.html" %}
{% block title %}Edit Doctor Article{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold text-dark mb-1">Edit Doctor Article</h3>
        <p class="text-muted small mb-0">Modify title, category, content, or publication status</p>
    </div>
    <a href="{{ url_for('admin_articles') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back to Articles List
    </a>
</div>

<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('admin_save_article', article_id=article.id) }}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label fw-bold">Article Title</label>
                    <input type="text" name="title" class="form-control form-control-lg" value="{{ article.title }}" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">Category</label>
                    <select name="category" class="form-select form-select-lg">
                        <option value="General Health" {% if article.category == 'General Health' %}selected{% endif %}>General Health</option>
                        <option value="Nutrition" {% if article.category == 'Nutrition' %}selected{% endif %}>Nutrition</option>
                        <option value="Mental Health" {% if article.category == 'Mental Health' %}selected{% endif %}>Mental Health</option>
                        <option value="Fitness" {% if article.category == 'Fitness' %}selected{% endif %}>Fitness</option>
                        <option value="Diseases" {% if article.category == 'Diseases' %}selected{% endif %}>Diseases</option>
                        <option value="Medications" {% if article.category == 'Medications' %}selected{% endif %}>Medications</option>
                        <option value="Wellness" {% if article.category == 'Wellness' %}selected{% endif %}>Wellness</option>
                        <option value="Pregnancy" {% if article.category == 'Pregnancy' %}selected{% endif %}>Pregnancy</option>
                        <option value="Childcare" {% if article.category == 'Childcare' %}selected{% endif %}>Childcare</option>
                        <option value="Eldercare" {% if article.category == 'Eldercare' %}selected{% endif %}>Eldercare</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Summary / Subtitle</label>
                    <input type="text" name="summary" class="form-control" value="{{ article.summary or '' }}" placeholder="Brief introduction summary for patients">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Cover Image URL</label>
                    <input type="url" name="imageUrl" class="form-control" value="{{ article.imageUrl or '' }}" placeholder="https://example.com/image.jpg">
                </div>

                <div class="col-md-12">
                    <label class="form-label fw-bold">Full Article Content</label>
                    <textarea name="content" class="form-control" rows="10" required>{{ article.content or article.body or '' }}</textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Publication & Admin Status</label>
                    <select name="status" class="form-select">
                        <option value="published" {% if article.status == 'published' or article.isPublished == true %}selected{% endif %}>✅ Published & Visible to Patients</option>
                        <option value="restricted" {% if article.status == 'restricted' or article.isPublished == false %}selected{% endif %}>🚫 Restricted / Blocked by Admin</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold">Featured Status</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" name="isFeatured" value="true" id="featuredToggle" {% if article.isFeatured %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="featuredToggle">Feature this article on Patient Home Carousel</label>
                    </div>
                </div>

                <div class="col-md-12 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold me-2">
                        <i class="bi bi-check-circle me-1"></i>Save Article Changes
                    </button>
                    <a href="{{ url_for('admin_articles') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
