<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2196F3;
            --secondary-color: #00BCD4;
            --success-color: #4CAF50;
            --warning-color: #FF9800;
            --danger-color: #F44336;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        .sidebar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: all 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .stat-card {
            border-radius: 10px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
        }
        .stat-card i {
            font-size: 3rem;
            opacity: 0.3;
        }
        .badge-pending { background-color: var(--warning-color); }
        .badge-approved { background-color: var(--success-color); }
        .badge-rejected { background-color: var(--danger-color); }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar col-md-2 p-0">
            <div class="p-4">
                <h4><i class="fas fa-user-shield"></i> Admin Panel</h4>
            </div>
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-dashboard"></i> Dashboard
                </a>
                <a href="/doctors" class="{% if 'doctors' in request.path %}active{% endif %}">
                    <i class="fas fa-user-doctor"></i> Doctors
                </a>
                <a href="/patients" class="{% if 'patients' in request.path %}active{% endif %}">
                    <i class="fas fa-users"></i> Patients
                </a>
                <a href="/analytics" class="{% if 'analytics' in request.path %}active{% endif %}">
                    <i class="fas fa-chart-line"></i> Analytics
                </a>
                <a href="/logout">
                    <i class="fas fa-sign-out"></i> Logout
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
