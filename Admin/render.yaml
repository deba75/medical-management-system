services:
  - type: web
    name: mediconnect-web-portal
    env: python
    region: singapore
    plan: free
    rootDir: Admin
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.13
